name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: Unix Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  macos:
    name: macOS Node 24
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows-non-pty:
    name: Windows Node ${{ matrix.node }} (non-PTY)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --test --test-concurrency=1 test/cli.test.cjs test/config.test.cjs test/content.test.cjs test/language.test.cjs test/render.test.cjs test/search.test.cjs test/selection-clipboard.test.cjs test/theme.test.cjs
